<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand fw-bold">
            📚 Library Management System
        </span>

    </div>

</nav>


<!-- MAIN CONTAINER -->

<div class="container py-4">


    <!-- HEADER -->

    <div class="text-center mb-4">

        <h1 class="fw-bold">
            Library Management System
        </h1>

        <p class="text-muted">
            Manage books, issue books and return books easily
        </p>

    </div>


    <!-- DASHBOARD -->

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <div class="stat-card">

                <h5>Total Books</h5>

                <h2 id="totalBooks">0</h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <h5>Available Books</h5>

                <h2 id="availableBooks">0</h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <h5>Issued Books</h5>

                <h2 id="issuedBooks">0</h2>

            </div>

        </div>

    </div>


    <!-- ADD / UPDATE BOOK -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h3 id="formTitle" class="mb-4">
                Add New Book
            </h3>


            <form id="bookForm">

                <input
                    type="hidden"
                    id="bookId">


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Book Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            placeholder="Enter book title"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Author
                        </label>

                        <input
                            type="text"
                            id="author"
                            class="form-control"
                            placeholder="Enter author name"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            class="form-control"
                            placeholder="Example: Programming"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Publication Year
                        </label>

                        <input
                            type="number"
                            id="year"
                            class="form-control"
                            placeholder="Example: 2024"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn-primary">

                    Add Book

                </button>


                <button
                    type="button"
                    id="cancelButton"
                    class="btn btn-secondary"
                    onclick="cancelEdit()"
                    style="display:none;">

                    Cancel

                </button>

            </form>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <div class="row align-items-center">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="searchBox"
                        class="form-control"
                        placeholder="🔍 Search by title, author or category">

                </div>

                <div class="col-md-4 mt-2 mt-md-0">

                    <button
                        class="btn btn-primary w-100"
                        onclick="loadBooks()">

                        Search Books

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOK TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-4">
                📖 Book Collection
            </h3>


            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">

                        <tr>

                            <th>Title</th>

                            <th>Author</th>

                            <th>Category</th>

                            <th>Year</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="bookList">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
